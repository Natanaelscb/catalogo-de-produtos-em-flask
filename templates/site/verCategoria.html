{% extends 'site/base.html' %}
{% block title %}
  Ver Categorias
{% endblock %}
{% block content %}
  <h3 class="fw-bold mb-3">Produtos da Categoria {{ categorias.nome }}</h3>
  <div>
    {% for item in produto %}
      <div class="col-6 col-md-3 col-lg-3">
        <div class="card h-100 shadow-sm">
          <!-- Imagem do produto --> <img src="data:image/jpeg;base64,
            {{ item.imagem }}" width="50" class="card-img-top p-2" alt="{{ item.nome }}" style="height: 110px; object-fit: contain;" />
          <div class="card-body p-2">
            <!-- Nome -->
            <h6 class="card-title mb-1">{{ item.nome }}</h6>
            <h6 class="card-title mb-1">{{ item.nome_categoria }}</h6>
            <!-- Preço e botão --> <div class="d-flex justify-content-between align-items-center gap-1">
              <strong class="small">R$ {{ '%.2f'|format(item.preco) }}</strong>
              <h6 class="card-title mb-1">{{ item.descricao }}</h6>
            </div>
          </div>
        </div>
      </div>
    {% endfor %}
  </div>
{% endblock %}
