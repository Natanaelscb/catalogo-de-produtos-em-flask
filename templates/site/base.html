<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adega do Baiano - Home</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
  </head>
  <body class="bg-light">
    <!-- Cabeçalho / Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4">
      <div class="container">
        <a class="navbar-brand fw-bold text-primary" href="{{ url_for('home') }}">BODEGA DO BAIANO</a>
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link {% if request.endpoint == 'home' %}active fw-bold{% endif %}" href="{{ url_for('home') }}"><i class="bi bi-house-door"></i> Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link nav-link {% if request.endpoint == 'categorias' %}active fw-bold{% endif %}" href="{{ url_for('categorias') }}"><i class="bi bi-grid"></i> Categorias</a>
          </li>
          <li class="nav-item">
            <a class="nav-link nav-link {% if request.endpoint == 'produtos' %}active fw-bold{% endif %}" href="{{ url_for('produtos') }}"><i class="bi bi-basket"></i> Produtos</a>
          </li>
        </ul>
      </div>
    </nav>

    <div class="container my-5">
      <main>
        {% block content %}

        {% endblock %}
      </main>
    </div>
    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
